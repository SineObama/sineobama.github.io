# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: SineObama的博客
subtitle: ''
description: ''
keywords:
author: SineObama
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://sine1995.gitee.io
permalink: :title.html
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: docs
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -updated

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''

# 以下新增插件推荐 https://butterfly.js.org/posts/4073eda/#%E6%8F%92%E4%BB%B6%E6%8E%A8%E8%96%A6
## https://github.com/hexojs/hexo-filter-nofollow 加强网站SEO和防止权重流失
nofollow:
  enable: true
  field: site
  exclude:

## https://github.com/hexojs/hexo-generator-feed
feed:
  enable: true
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content:
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date
  icon: icon.png
  autodiscovery: true
  template:

## https://github.com/hexojs/hexo-generator-sitemap
sitemap:
  path:
    - sitemap.xml
    - sitemap.txt
  template:
  template_txt:
  rel: false
  tags: true
  categories: true

## https://github.com/wzpan/hexo-generator-search
search:
  path: search.xml
  field: all
  content: true
  template:

## https://github.com/hexojs/hexo-renderer-markdown-it
markdown:
  preset: 'default'
  render:
    html: true
    xhtmlOut: false
    langPrefix: 'language-'
    breaks: true
    linkify: true
    typographer: true
    quotes: '“”‘’'
  enable_rules:
  disable_rules:
  plugins:
    - markdown-it-abbr
    - markdown-it-footnote
    - markdown-it-ins
    - markdown-it-sub
    - markdown-it-sup
  anchors:
    level: 2
    collisionSuffix: ''
    # 与 butterfly 主题的 anchor 冲突，开启也不好用，就关闭了
    permalink: false
    permalinkClass: 'header-anchor'
    permalinkSide: 'left'
    permalinkSymbol: '¶'
    case: 0
    separator: '-'
  images:
    lazyload: false
    prepend_root: false
    post_asset: false
  inline: false  # https://markdown-it.github.io/markdown-it/#MarkdownIt.renderInline

# 以下自定义脚本
## 解决内链问题
replace_internal_link:
  enable: true
  # 在渲染前替换
  replace_before_render: true
  # 开启内部链接有效性检查，做相应处理并提供警告信息
  valid_check:
    enable: true
    # 直接删除无效链接地址（不可跳转）
    remove_link: true
    # 屏蔽以下规则的链接的警告（常用“包含”关系）。使用 https://github.com/hexojs/hexo-util#patternrule
    suppress_warning_rules:
      # 功能单元测试，稳定后不需要提示
      - Sine测试
      # 统一管理的私人资料不开放
      - 231_用户账号
      - 232_社会关系
      # 转载的外部资料不进行发布
      - 300_资源

## 检测用词并警告，部署时关闭或许可以提高一点速度
forbidden_word_check:
  enable: true
  # regular expression
  reg_exp:
    - ["\u79d1\u5b66\u4e0a\u7f51", 富强上网]
    - ["\u8f6e\u76d8", 转盘]
    - ["UU\u52a0\u901f\u5668", UU网游加速器]

## 目前用于替换外部的cdn域名
replace_external_link:
  enable: true

## 外部链接检查，配置排除可信的域名，可用二级域名匹配后缀，出现列表外的域名会发出警告，部署时关闭或许可以提高一点速度
external_link_check:
  enable: false
  trusted:

## 支撑图片使用相对路径
replace_relative_image_src:
  enable: true

## 拷贝_posts文件夹中的资源
generate_assets_in_posts:
  enable: true

## 对没有设置分类的文章，将该文章的“多级”标签转为多级分类。
generate_categories_from_tags:
  enable: true
  warnNoTag: true
  warnNoCategory: false

## 根据文章变量，在标题前面加上文字标记。
post_title_mark:
  enable: true
